name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and unit test
        run: ./gradlew build

      - name: Cache Minecraft clients for the compatibility check
        uses: actions/cache@v6
        with:
          path: build/compat-cache
          key: compat-cache-${{ hashFiles('versions/*/gradle.properties') }}
          restore-keys: compat-cache-

      - name: Check every jar against every Minecraft version it claims
        run: python3 scripts/check_compat.py

      - uses: actions/upload-artifact@v7
        with:
          name: fishing-friend
          path: build/libs/*.jar

  # Launches Minecraft on a virtual screen, fishes for real and checks what the mod does.
  game-test:
    name: In-game test (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Minecraft 1.21.8
            slug: mc1.21.8
            project: '1.21'
            run_dir: versions/1.21/build/run/clientGameTest
          - name: Minecraft 1.21.11
            slug: mc1.21.11
            project: '1.21.9'
            run_dir: versions/1.21.9/build/run/clientGameTest
          - name: Minecraft 26.1
            slug: mc26.1
            project: '26.1'
            run_dir: versions/26.1/build/run/clientGameTest
          - name: Minecraft 26.2
            slug: mc26.2
            project: '26.2'
            run_dir: versions/26.2/build/run/clientGameTest
          # The released 1.21.9-1.21.11 jar, run on a version it wasn't compiled against.
          - name: Minecraft 1.21.10, released jar
            slug: mc1.21.10-jar
            jar_project: '1.21.9'
            minecraft: '1.21.10'
            fabric_api: '0.138.4+1.21.10'
            run_dir: testing/jar-test/build/run/clientGameTest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Install a virtual screen
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run the in-game test
        if: matrix.project
        run: ./gradlew ":${{ matrix.project }}:runClientGameTest" 2>&1 | tee gametest.log

      - name: Run the in-game test against the released jar
        if: matrix.minecraft
        run: |
          ./gradlew ":${{ matrix.jar_project }}:build" -x test
          label=$(grep '^mc_label=' "versions/${{ matrix.jar_project }}/gradle.properties" | cut -d= -f2)
          jar=$(ls build/libs/*+mc${label}.jar)
          ./gradlew -p testing/jar-test runClientGameTest \
            -Pmc=${{ matrix.minecraft }} -PfabricApi=${{ matrix.fabric_api }} -Pjar="$jar" 2>&1 | tee gametest.log

      - name: Check the result
        if: always()
        run: python3 scripts/check_gametest.py "${{ matrix.run_dir }}" gametest.log

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.slug }}
          path: ${{ matrix.run_dir }}/screenshots
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, game-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: fishing-friend
          path: jars

      - name: Attach jars to the release
        uses: softprops/action-gh-release@v3
        with:
          files: jars/*.jar
